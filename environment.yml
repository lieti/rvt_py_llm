# Upstream development environment (pandas, geopandas, rasterio, jupyter are not needed by rvt/);
# runtime requirements are in setup.py (install_requires: numpy, scipy, matplotlib, gdal).
name: rvt311
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - gdal
  - numpy
  - scipy
  - matplotlib
  - pandas
  - geopandas
  - rasterio
  - jupyter
  # Optional: numba enables the compiled paths of rvt._accel (same results; numpy is used without it).
  # - numba>=0.60
